comment: "Calvados 3 coarse grained amino acid model for use with Faunus"

#T:  298.15
#pH: 4.1
#salt_c: 7e-05
#epsilon: 0.8368
#sidechains: False
#xyz_path: 1L2Y_capped.xyz

atoms:
  - {charge: -0.90, hydrophobicity: !Lambda 0, mass: 0, name: CTR, σ: 2.0, ε: 0.8368}
  - {charge: 1.00, hydrophobicity: !Lambda 0, mass: 0, name: NTR, σ: 2.0, ε: 0.8368}
  - {charge: 1.00, hydrophobicity: !Lambda 0.7490391146081136, mass: 156.19, name: ARG, σ: 6.56, ε: 0.8368, custom: {alpha: 0.0}}
  - {charge: -0.82, hydrophobicity: !Lambda 0.09361853728665927,  mass: 115.09, name: ASP, σ: 5.58, ε: 0.8368, custom: {alpha: 0.0}}
  - {charge: -0.48, hydrophobicity: !Lambda 0.00025236977671135995,  mass: 129.11, name: GLU, σ: 5.92, ε: 0.8368, custom: {alpha: 0.0}}
  - {charge: 1.00, hydrophobicity: !Lambda 0.13959758092709595, mass: 128.17, name: LYS, σ: 6.36, ε: 0.8368, custom: {alpha: 0.0}}
  - {charge: 1.00, hydrophobicity: !Lambda 0.41326876872684276, mass: 137.14, name: HIS, σ: 6.08, ε: 0.8368, custom: {alpha: 0.0}}
  - {charge: 0.01, hydrophobicity: !Lambda 0.5988477552413471, mass: 103.14, name: CYS, σ: 5.48, ε: 0.8368, custom: {alpha: 0.0}}
  - {charge: 0.0, hydrophobicity: !Lambda 0.3748239879922917, mass: 114.1,  name: ASN, σ: 5.68, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.3178452692363027, mass: 128.13, name: GLN, σ: 6.02, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.4522951850918826, mass: 87.08,  name: SER, σ: 5.18, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.7622248584377307, mass: 57.05,  name: GLY, σ: 4.5,  ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.2702145475476793, mass: 101.11, name: THR, σ: 5.62, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.3414850608944334, mass: 71.09,  name: ALA, σ: 5.12, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.5228452810204477, mass: 131.2,  name: MET, σ: 6.18, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.9612141153319771,  mass: 163.18, name: TYR, σ: 6.46, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.29688690601596035, mass: 99.13,  name: VAL, σ: 5.86, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 1.0449577837711024,  mass: 186.22, name: TRP, σ: 6.78, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.5610400181104085, mass: 113.16, name: LEU, σ: 6.18, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.5187526824360685, mass: 113.16, name: ILE, σ: 6.18, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.3508414144472418, mass: 97.12,  name: PRO, σ: 5.56, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.9005624332988602, mass: 147.18, name: PHE, σ: 6.36, ε: 0.8368}
  - {charge: 0.0, hydrophobicity: !Lambda 0.5988477552413471, mass: 103.14, name: CSS, σ: 5.48, ε: 0.8368}

molecules:
- name: MOL1
  degrees_of_freedom: Rigid
  has_com: true
  from_structure: 1L2Y_capped.xyz

system:
  cell: !Cuboid [334.0209, 334.0209, 334.0209]
  medium:
    permittivity: !Water
    temperature: 298.15
    salt: [!NaCl, 7e-05]
  blocks:
  - molecule: MOL1
    N: 150
    insert: !GridCOM { rotate: true }
  energy:
    - !Nonbonded
      default:
        - !Fanourgakis {cutoff: 47.1}
        - !AshbaughHatch {mixing: arithmetic, cutoff: 20.0}

analysis:
- !Energy
  file: energy.csv.gz
  frequency: !Every 10
- !Energy
  file: hydrophobic_energy.csv.gz  
  frequency: !Every 10
  selections: ["hydrophobic and molecule MOL1", "hydrophobic and molecule MOL1"]
- !RadialDistribution
  selections: ["molecule MOL1", "molecule MOL1"]
  use_com: true
  file: rdf_com.dat.gz
  resolution: 0.5
  frequency: !Every 10
- !Trajectory
  file: traj.xtc
  frequency: !Every 5
  selection: "molecule MOL1"
- !Trajectory
  file: traj_final.xyz
  frequency: !End
  selection: "molecule MOL1"
- !Multipole
  selection: "molecule MOL1"
  frequency: !Every 10
- !MultipoleDistribution
  selections: ["molecule MOL1", "molecule MOL1"]
  file: multipole_dist.csv 
  resolution: 0.5
  frequency: !Every 10



propagate:
  seed: !Hardware
  criterion: Metropolis
  steps: 5000
  collections:
  - !Stochastic
    moves:
    - !RotateMolecule
      molecule: MOL1
      dprot: 1
      weight: 1.0
      repeat: 150
    - !TranslateMolecule
      molecule: MOL1
      dp: 10
      weight: 1.0
      repeat: 150
    - !ClusterMove
      molecule: MOL1
      dp: 10
      dprot: 1
      threshold: 46.25
      use_com: true
      weight: 1.0
      repeat: 10
